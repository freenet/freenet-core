name: QUIC Identity Property Tests (Weekly)

# The property tests on the QUIC peer-identity parsing and verification
# (`transport/quic/identity/tests.rs`) run in PR CI at 256 cases each, which
# finds a bug that shows up in the first few hundred inputs. This job runs the
# same tests with 300,000 cases each, to find the ones that do not.
#
# Weekly, not per PR: it adds about 10 minutes on a ubicloud-standard-8
# (a few dollars a month) and nothing about it depends on the PR's diff.
# Run it by hand (workflow_dispatch) to check a specific change.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per property test"
        required: false
        default: "300000"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spki-proptest:
    name: QUIC identity property tests
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Use mold linker to avoid rust-lld crashes
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      PROPTEST_CASES: ${{ github.event.inputs.cases || '300000' }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: spki-proptest
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      # A failing case is not printed: this repository is public, and a
      # failure here may be a defect in an authentication check that is not
      # fixed yet. The log keeps the names of the failing tests and the
      # summary line; reproduce by running the same command locally.
      - name: Run the identity property tests
        timeout-minutes: 35
        run: |
          set +e
          cargo test -p freenet --lib -- transport::quic::identity > "$RUNNER_TEMP/proptest.log" 2>&1
          status=$?
          set -e
          grep -E '^(test .* (ok|FAILED)|test result:)' "$RUNNER_TEMP/proptest.log" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::identity property tests failed (exit $status); output withheld, rerun locally with PROPTEST_CASES=$PROPTEST_CASES"
          fi
          exit "$status"
