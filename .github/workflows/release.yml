name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.31). Leave blank for auto-patch-bump from latest crates.io release.'
        required: false
        type: string
        default: ''
      ship_sha:
        description: 'Full 40-character SHA of the commit on main to release (the soaked commit). Required for a live run; a dry run defaults to the dispatch commit.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run - compute and package the release, print what would be created, push/tag/publish nothing'
        required: false
        type: boolean
        default: false

# A release ships EXACTLY `ship_sha` plus a version bump (commit B, parent
# ship_sha), never whatever main is when the run starts, so main need not be
# frozen during a cut. B is pushed as `release/vX.Y.Z`, ci.yml's push run on it
# is the full-suite gate, and B is tagged. main gets the same bump afterwards
# from release-sync.yml, when the release is published. docs/RELEASING.md.
permissions:
  contents: write

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    # 10: the live pre-flight adds a few API calls and a retried crates.io probe.
    timeout-minutes: 10
    # Reads only. Without this the job would hold the workflow's write token,
    # in a dry run as much as a live one.
    permissions:
      contents: read
      # check_release_preflight.sh lists release.yml runs and open
      # `release/v*` PRs to refuse a concurrent cut.
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      fdev_version: ${{ steps.ship.outputs.fdev_version }}
      # The commit this release ships, checked by scripts/resolve_release_ship.sh.
      ship_sha: ${{ steps.ship.outputs.ship_sha }}
      # 'true' ONLY for a live release. Every step that pushes, tags or creates
      # a release is gated on
      # `needs.validate.outputs.live == 'true'`, so an empty or missing value
      # skips it (fail closed). See scripts/resolve_release_mode.sh (#5936).
      live: ${{ steps.mode.outputs.live }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The ONLY reader of `inputs.dry_run` in this workflow. Rule Lint's
      # .github/scripts/check_release_dry_run.py fails a PR that reads it
      # anywhere else, or that adds a mutating step without the `live` guard.
      - name: Resolve run mode (live or dry run)
        id: mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: bash scripts/resolve_release_mode.sh

      # A LIVE run refuses without RELEASE_PAT; a dry run only warns. Without
      # it every push, tag and un-draft is made with GITHUB_TOKEN, whose events
      # GitHub suppresses: the release branch gets no CI, the tag push never
      # starts cross-compile.yml, and nothing ever un-drafts, announces or
      # syncs main. A live run without it stalls half-done (#4118, v0.2.57).
      - name: Check RELEASE_PAT is configured
        env:
          # Workflow secrets are not directly visible in `if:` expressions,
          # so we expose RELEASE_PAT via env and check for emptiness inside
          # the step. The value is never echoed.
          RELEASE_PAT_PRESENT: ${{ secrets.RELEASE_PAT != '' }}
          RELEASE_LIVE: ${{ steps.mode.outputs.live }}
        run: |
          if [ "$RELEASE_PAT_PRESENT" = "true" ]; then
            echo "✅ RELEASE_PAT is configured. Downstream workflows will be triggered automatically."
          elif [ "$RELEASE_LIVE" = "true" ]; then
            echo "::error title=RELEASE_PAT not set::A live release needs RELEASE_PAT. With GITHUB_TOKEN the release-branch push starts no CI, the tag push does not start cross-compile.yml and the un-draft fires no gateway-update or announcement, so the release would stop half-done. Configure a RELEASE_PAT repo secret with 'repo' + 'workflow' scopes. See issue #4118 and AGENTS.md → 'Release Workflow & RELEASE_PAT'."
            exit 1
          else
            echo "::warning title=RELEASE_PAT not set::Dry run only. A live run refuses without RELEASE_PAT (#4118)."
          fi

      # The crates.io credential is checked HERE, in the first job, because the
      # publish that needs it now runs at the very END of the pipeline -- after
      # the release-branch CI, the tag, ~30 minutes of cross-compilation and macOS
      # notarization, and Gate A. Discovering a missing token at that point
      # costs the whole run and a tag, which is F3's shape reappearing one step
      # further down. Fail before anything has been created.
      #
      # PRESENCE ONLY. Deliberately no live-validity probe -- do NOT add one.
      #
      # #5342 added exactly that: a probe of `https://crates.io/api/v1/me` with
      # the token in an `Authorization` header, treating 401/403 as "expired,
      # revoked, or lacks publish scope" and exiting 1. It fired unconditionally
      # and blocked EVERY release, including the 0.2.128 cut, because
      # `/api/v1/me` is a session-COOKIE endpoint that never accepts API tokens
      # at all. Measured directly against crates.io:
      #
      #   /api/v1/me  with a VALID token   -> HTTP 403
      #   /api/v1/me  with NO auth header  -> HTTP 403
      #   body: {"errors":[{"detail":"this action can only be performed on the
      #          crates.io website"}]}
      #
      # So the probe could not distinguish a good token from a bad one from no
      # token at all: a gate no input could turn green.
      #
      # And there is no replacement endpoint. Every read endpoint on the API was
      # measured with a valid token ("good") and an invalid one ("bad"):
      #
      #   /api/v1/me                     good=403 bad=403
      #   /api/v1/me/updates             good=403 bad=403
      #   /api/v1/me/tokens              good=403 bad=403
      #   /api/v1/tokens                 good=404 bad=404
      #   /api/v1/me/crates              good=404 bad=404
      #   /api/v1/crates/freenet/owners  good=200 bad=200   <- PUBLIC endpoint
      #   /api/private/session           good=405 bad=405
      #
      # NONE discriminates. In particular do not "fix" this by switching to
      # `/api/v1/crates/<crate>/owners`: it answers 200 for an invalid token and
      # for no auth, which is the same defect inverted -- a gate no input can
      # turn RED, which is worse, because it reports success it never checked.
      #
      # What that costs us, stated plainly: a token that is PRESENT but expired
      # or wrong-scope is no longer detected here. It surfaces at the publish
      # step, which under the #5342 ordering is after Gate A and after the full
      # build -- expensive, and exactly the cost the probe was meant to avoid.
      # That is a real loss. It is strictly better than a gate that blocks every
      # release, and until crates.io exposes a token-authenticated read endpoint
      # there is no third option. `cargo publish` itself is the only operation
      # that validates the credential, and it is not idempotent, so it cannot be
      # run as a probe.
      #
      # The remaining check is still worth its place: a missing secret is the
      # common real failure (an unset or rotated-away repo secret), it is
      # deterministic, and it costs nothing to catch here.
      #
      # Sibling, same shape, already correct: cross-compile.yml's "Check the
      # crates.io credential is present" is presence-only for these reasons.
      #
      # Pinned by scripts/release_canary_wiring_test.sh (assertion 2b-quater),
      # which fails if a validity probe is re-added or the refusal is removed.
      - name: Verify the crates.io token before anything is created
        if: steps.mode.outputs.live == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error title=CARGO_REGISTRY_TOKEN not set::The crates.io publish runs at the END of the release (in cross-compile.yml, after Gate A), so without this secret the release would fail after the tag, the binaries and ~30 minutes of cross-compilation. Set the CARGO_REGISTRY_TOKEN repo secret and re-run. See AGENTS.md and docs/RELEASING.md."
            exit 1
          fi
          echo "✅ CARGO_REGISTRY_TOKEN is present. Its live validity is NOT checked here; see the comment above this step for why crates.io offers no endpoint that could."

      # Presence only, like the crates.io token above. cross-compile.yml's
      # "Sign SHA256SUMS.txt" refuses to publish an unsigned release, and that
      # runs after the tag and ~25 minutes of builds; finding a missing key
      # here costs nothing.
      - name: Verify the release signing key before anything is created
        if: steps.mode.outputs.live == 'true'
        env:
          FREENET_RELEASE_SIGNING_KEY_PRESENT: ${{ secrets.FREENET_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$FREENET_RELEASE_SIGNING_KEY_PRESENT" != "true" ]; then
            echo "::error title=FREENET_RELEASE_SIGNING_KEY not set::cross-compile.yml refuses to publish an unsigned release, so without this secret the release would stop as a draft after the tag and the builds. Restore the secret and re-run."
            exit 1
          fi
          echo "✅ FREENET_RELEASE_SIGNING_KEY is present."

      - name: Resolve + validate version
        id: validate
        env:
          # Via env, not `${{ }}` in the script: the raw input is templated in
          # before the format check below could reject it.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"

          if [[ -z "$VERSION" ]]; then
            # Auto-bump: take the highest released version on crates.io for
            # the `freenet` crate and increment the patch. Minor/major bumps
            # still require explicit input.
            # `|| true`: under pipefail a curl failure would abort before the
            # error below names the cause; the regex check still fails closed.
            LATEST=$(curl -sS -A 'github-actions' https://crates.io/api/v1/crates/freenet \
              | jq -r '.crate.max_version' || true)
            if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not resolve latest version from crates.io (got: '$LATEST')"
              exit 1
            fi
            # Bump from crates.io alone, never from this tree. The tree is the
            # dispatch ref, not the ship commit, and main's version lags a
            # release until its merge-back lands, so it is routinely BEHIND
            # crates.io. A Gate A block no longer leaves an unpublished bump on
            # main either (the bump lives only on release/vX), so crates.io + 1
            # is also the right re-cut of a blocked version. The pre-flight
            # still checks the result against the ship commit and the latest
            # published release.
            BASE="$LATEST"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "::notice::No version input; auto-bumping patch from crates.io latest $LATEST → $VERSION"
          else
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be in format X.Y.Z (e.g., 0.1.31). Got: $VERSION"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Release version: freenet $VERSION (fdev is resolved with the ship commit, next)"

      # Which commit ships, and the fdev version. A live run refuses without
      # ship_sha, or with one that is not on main or does not contain the
      # previous release's ship commit; a dry run defaults to the dispatch
      # commit and only warns. fdev = max(fdev at ship_sha, fdev at the latest
      # published tag) + 1 patch, since main lags a release until its
      # merge-back. Tests: scripts/resolve_release_ship_test.sh.
      - name: Resolve and check the ship commit
        id: ship
        env:
          # Via env, not `${{ }}` in the script, for the same reason as above.
          SHIP_SHA_INPUT: ${{ inputs.ship_sha }}
          RELEASE_LIVE: ${{ steps.mode.outputs.live }}
          LAUNCH_SHA: ${{ github.sha }}
          # The ci.yml gate tests the real release/vX.Y.Z branch name.
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          # Read-only API lookups; this job's token can only read.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve_release_ship.sh

      # Refuse, before anything is created, the cuts that would otherwise fail
      # half-done: a tag that already exists, a version already on crates.io or
      # not above the ship commit's and the latest release's, or a concurrent
      # cut. Live only; a dry run creates nothing, so it has nothing to collide
      # with.
      - name: Refuse a version that is spent or already being cut
        if: steps.mode.outputs.live == 'true'
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          # The ship commit's manifest, not the dispatch ref's.
          CARGO_TOML: ${{ steps.ship.outputs.ship_cargo_toml }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_release_preflight.sh

      # The QUIC data ramp release must be published within 3 h of its ramp
      # start (QUIC_DATA_RAMP_START), which is fixed in the binary: a late
      # publish starts every node part-way along the curve. This measures the
      # DISPATCH time; cross-compile.yml's attach-to-release job checks again
      # just before the crates.io publish and the un-draft, so a re-run checks
      # the clock it publishes at. Nodes then take the release over the 0-4 h
      # auto-update stagger, on top of either. The ramp release is checked
      # against T0; another version passes unless it would ship the ramp
      # unchecked (before the ramp release, or skipping it), which fails
      # closed. A live run that fails stops here, before anything is created;
      # a dry run gets a warning. Pinned by scripts/check_quic_data_ramp_t0_test.sh.
      - name: Check the QUIC data ramp start is near now
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_LIVE: ${{ steps.mode.outputs.live }}
          # Read-only: the check asks the GitHub API whether a release is
          # published, and the anonymous limit is shared by the runner's
          # address. The workflow token is enough to read; nothing here writes.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_quic_data_ramp_t0.sh --version "$RELEASE_VERSION" --live "$RELEASE_LIVE"

  # Runs in BOTH modes: the bump is computed and committed locally either way.
  # Only a live run pushes it (#5936: a dry run used to push, open a PR and
  # auto-merge it, landing the version bump on main).
  #
  # The bump commit B is made on top of the SHIP commit, not the dispatch ref:
  # B = ship_sha + version files, so what is tagged is exactly what was soaked.
  update_versions:
    name: Commit the version bump on the ship commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    outputs:
      # The release commit B and its branch. wait_for_ci gates on B's CI.
      bump_sha: ${{ steps.bump.outputs.bump_sha }}
      branch: ${{ steps.bump.outputs.branch }}
      # Set only in a dry run: the unpushed bump commit, shipped to
      # `dry_run_rehearsal` as a git bundle artifact.
      dry_run_bump_sha: ${{ steps.dry_run_report.outputs.bump_sha }}
    env:
      RELEASE_LIVE: ${{ needs.validate.outputs.live }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Live: RELEASE_PAT when set (coalescing to GITHUB_TOKEN), exactly as
          # before, so the push below fires ci.yml on the release branch. Dry
          # run: the workflow token, used for the fetch only, because no
          # credential is persisted to .git/config, so even a `git push` that
          # slipped past every guard below cannot authenticate. The job still
          # holds the workflow-level write token; Rule Lint forbids handing it,
          # or any other secret, to a step that runs in a dry run here (this
          # token line is the one exemption).
          token: ${{ (needs.validate.outputs.live == 'true' && secrets.RELEASE_PAT) || secrets.GITHUB_TOKEN }}
          persist-credentials: ${{ needs.validate.outputs.live == 'true' }}

      # The release TOOLING comes from the dispatch ref (this checkout); the
      # TREE being released is ship_sha, which may predate the tooling. So the
      # bump script is copied out before the working tree moves to ship_sha.
      - name: Check out the ship commit
        env:
          SHIP_SHA: ${{ needs.validate.outputs.ship_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/apply_version_bump.sh "$RUNNER_TEMP/release-tools/"
          git fetch --no-tags --depth=1 origin "$SHIP_SHA"
          git checkout --detach "$SHIP_SHA"
          [ "$(git rev-parse HEAD)" = "$SHIP_SHA" ] || { echo "::error::Checkout is not at the ship commit $SHIP_SHA."; exit 1; }

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # One script for these rewrites, shared with release-sync.yml (the
      # merge-back onto main), so the two cannot drift. It verifies every
      # rewrite took (#4119, #3995).
      - name: Apply the version bump
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          FDEV_VERSION: ${{ needs.validate.outputs.fdev_version }}
        run: bash "$RUNNER_TEMP/release-tools/apply_version_bump.sh" "$VERSION" "$FDEV_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Update Cargo.lock
        # apps/freenet-ping is a separate nested workspace with its own
        # Cargo.lock that path-depends on crates/core, so the version bump
        # leaves it stale too. `cargo metadata` re-resolves it without
        # upgrading anything that still satisfies its requirements: the freenet
        # path-dep version changes, plus whatever crates/core's dependency
        # changes since the last sync force.
        run: |
          cargo update --workspace
          cargo metadata --format-version 1 --manifest-path apps/freenet-ping/Cargo.toml > /dev/null

      # `git add -u`: only files the ship commit already tracks. wait_for_ci
      # refuses a release commit that changes anything but the version files.
      - name: Commit the version bump locally
        id: bump
        run: |
          BRANCH="release/v${{ needs.validate.outputs.version }}"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: bump versions to ${{ needs.validate.outputs.version }}

          - freenet: → ${{ needs.validate.outputs.version }}
          - fdev: → ${{ needs.validate.outputs.fdev_version }}

          🤖 Automated release commit"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A previous attempt at the same version (a re-cut after deleting its
      # tag, or a re-run of this job) leaves release/vX at an older B, which
      # must be replaced. The branch is DELETED and pushed fresh rather than
      # force-pushed: a re-cut on the same ship commit makes a B with the same
      # TREE as the old tip, a force-push of it changes no file, and ci.yml's
      # push `paths-ignore` filter would have nothing to match, so whether its
      # gate runs at all would rest on undocumented empty-diff behaviour. A new
      # branch is diffed against its parent (ship_sha), which always changes a
      # Cargo manifest. The branch carries only this release's bump commit;
      # validate's pre-flight has already refused a version whose tag exists,
      # an unfinished other release, and a concurrent release run.
      - name: Push the release branch
        if: needs.validate.outputs.live == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          [ "${RELEASE_LIVE:-}" = "true" ] || { echo "::error title=Refusing in a dry run::Not pushing the release branch: this run is not live (#5936)."; exit 1; }
          rc=0
          git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" > /dev/null || rc=$?
          case "$rc" in
            0) echo "Replacing the existing $RELEASE_BRANCH (a re-cut or a re-run)."
               git push origin --delete "$RELEASE_BRANCH" ;;
            2) ;;
            *) echo "::error::Could not ask origin whether $RELEASE_BRANCH exists (git ls-remote exit $rc)."; exit 1 ;;
          esac
          git push origin "$RELEASE_BRANCH"

      # The dry-run counterpart of the push: say what a live run would do, then
      # hand the unpushed commit to `dry_run_rehearsal`.
      - name: "Dry run: report what a live run would push"
        id: dry_run_report
        if: needs.validate.outputs.live != 'true'
        env:
          RELEASE_BRANCH: ${{ steps.bump.outputs.branch }}
          SHIP_SHA: ${{ needs.validate.outputs.ship_sha }}
        run: |
          set -o pipefail  # a failed `git diff` must not hide behind `tee`
          BUMP_SHA=$(git rev-parse HEAD)
          {
            echo "## 🏃 Release dry run: nothing was pushed"
            echo
            echo "A live run would now:"
            echo "1. push branch \`$RELEASE_BRANCH\` at \`$BUMP_SHA\` (the ship commit \`$SHIP_SHA\` plus this bump)"
            echo "2. wait for ci.yml's full-suite push run on \`$BUMP_SHA\` to pass"
            echo "3. tag \`$BUMP_SHA\`, create a DRAFT release, and let cross-compile.yml build, run Gate A, publish to crates.io and un-draft"
            echo "4. on publish, release-sync.yml opens a PR syncing main's version to this release"
            echo
            echo "Version bump (\`$SHIP_SHA\` → \`$BUMP_SHA\`):"
            echo
            echo '```diff'
            git diff HEAD~1 HEAD -- crates/core/Cargo.toml crates/fdev/Cargo.toml
            echo '```'
            echo
            echo "Files in the bump commit (Cargo.lock comes from \`cargo update --workspace\`):"
            echo
            git show --stat --format= HEAD | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The commit exists only on this runner. A bundle carries it, with its
          # SHA intact, to the rehearsal job, which packages exactly this tree.
          git bundle create "$RUNNER_TEMP/release-bump.bundle" "$RELEASE_BRANCH" "^$SHIP_SHA"
          echo "bump_sha=$BUMP_SHA" >> "$GITHUB_OUTPUT"

      - name: "Dry run: hand the bump commit to the rehearsal job"
        if: needs.validate.outputs.live != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-bump
          path: ${{ runner.temp }}/release-bump.bundle
          retention-days: 1
          if-no-files-found: error
          overwrite: true  # a re-run of the same run id re-uploads it

  # Dry run only. Everything a live run checks before its first irreversible
  # step, run against the unpushed bump commit, with a read-only token: the
  # checkout verifier, the crates.io packaging dry run, and the changelog the
  # release notes would be generated from. In a live run `verify_publishable`
  # and `create_release` do this against the release commit instead.
  dry_run_rehearsal:
    name: "Dry run: rehearse on the unpushed bump"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, update_versions]
    if: needs.validate.outputs.live != 'true'
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.update_versions.outputs.dry_run_bump_sha }}
      # Same value as RELEASE_SHA on purpose: there is no `|| github.sha`
      # fallback here, so "was a SHA resolved" is just "is it non-empty". The
      # independent oracle is EXPECTED_VERSION, read from `validate`.
      RELEASE_SHA_RESOLVED: ${{ needs.update_versions.outputs.dry_run_bump_sha }}
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      SHIP_SHA: ${{ needs.validate.outputs.ship_sha }}

    steps:
      - name: Checkout the launch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the bump bundle
        uses: actions/download-artifact@v8
        with:
          name: release-dry-run-bump
          path: ${{ runner.temp }}/bump

      # The bundle's prerequisite is the ship commit, which a dry run with an
      # explicit ship_sha does not have checked out.
      - name: Check out the unpushed version-bump commit
        run: |
          # The verifier comes from this (dispatch) checkout, not the bump
          # commit's tree, which is the possibly older ship commit.
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/verify_release_checkout.sh "$RUNNER_TEMP/release-tools/"
          git fetch --no-tags --depth=1 origin "$SHIP_SHA"
          git fetch --no-tags "$RUNNER_TEMP/bump/release-bump.bundle" "refs/heads/release/v$EXPECTED_VERSION"
          git checkout --detach "$RELEASE_SHA"

      - name: Verify the checkout is the bump commit
        run: bash "$RUNNER_TEMP/release-tools/verify_release_checkout.sh"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Verify freenet packages cleanly (dry run)
        run: |
          echo "📦 [DRY RUN] Verifying freenet $EXPECTED_VERSION can be published to crates.io..."
          cargo publish -p freenet --dry-run
          echo "✅ freenet dry-run successful"

      # Read-only. GitHub's generate-notes endpoint needs write access, so the
      # preview lists the commits it would summarise instead. It is an
      # approximation: the live notes pick their own previous tag.
      - name: Changelog since the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # coalesce-exempt: read-only, contents:read job
        run: |
          set -o pipefail
          if ! PREV=$(gh release list --exclude-drafts --limit 50 --json tagName --jq '.[0].tagName // empty'); then
            echo "::error::Could not list releases, so the changelog preview is unavailable."
            exit 1
          fi
          {
            echo "## Changelog preview for v$EXPECTED_VERSION (approximate)"
            echo
            if [ -z "$PREV" ]; then
              echo "No previous release found."
            else
              TOTAL=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$SHIP_SHA" --jq '.total_commits')
              echo "$TOTAL commit(s) up to the ship commit since $PREV (the bump commit itself excluded; at most 250 listed):"
              echo
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$SHIP_SHA" \
                --jq '.commits[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"'
            fi
            echo
            echo "A live run would tag \`v$EXPECTED_VERSION\` and create a DRAFT release with GitHub-generated notes for this range."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The full-suite gate on the exact commit that ships. ci.yml runs on the push
  # of `release/v*` (update_versions above); this waits for that run and
  # refuses anything but success with every required job passed. It also
  # checks B is ship_sha plus version files and nothing else. Replaces the old
  # wait for the bump PR's merge queue, whose merge commit could carry commits
  # nobody soaked.
  wait_for_ci:
    name: Wait for CI on the release commit
    runs-on: ubuntu-latest
    # The waiter's own wall-clock budget is 75 min (MAX_WAIT): the full suite
    # in parallel (Unit & Integration, Simulation, NAT Validation,
    # Windows/macOS units, ~15-40 min on busy runners) plus scheduling. The job
    # limit is 15 min above it, so the waiter's own diagnosis (which run, which
    # jobs) is what fails the job, not a bare cancellation. Pinned by
    # scripts/wait_for_release_ci_test.sh.
    timeout-minutes: 90
    needs: [validate, update_versions]
    # Live only: a dry run pushes nothing, so there is no CI to wait for. The
    # dry-run counterpart of this job and the two after it is
    # `dry_run_rehearsal`.
    if: needs.validate.outputs.live == 'true'
    permissions:
      actions: read
      contents: read
    # The single immutable commit the rest of the pipeline builds, publishes
    # and tags. Everything downstream MUST check this out explicitly (#5233).
    outputs:
      release_sha: ${{ steps.wait.outputs.release_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for the full CI suite on the release commit
        id: wait
        env:
          # This job is read-only and has explicit least-privilege access above.
          # Use GITHUB_TOKEN here because a fine-grained RELEASE_PAT may not
          # carry Actions: read.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # coalesce-exempt: read-only polling
          RELEASE_SHA: ${{ needs.update_versions.outputs.bump_sha }}
          RELEASE_BRANCH: ${{ needs.update_versions.outputs.branch }}
          SHIP_SHA: ${{ needs.validate.outputs.ship_sha }}
        run: bash scripts/wait_for_release_ci.sh

  # The crates.io publish itself does NOT happen here. It happens in
  # cross-compile.yml's `attach-to-release` job, AFTER the blocking auto-update
  # pre-flight canary (Gate A, #5222) has passed. This job keeps only the
  # reversible half.
  #
  # WHY THE PUBLISH MOVED (#5288 / the 0.2.124 loss). The order used to be
  # publish-to-crates.io -> tag -> build -> Gate A -> un-draft, so the one step
  # that can never be undone ran before the gate that decides whether to ship at
  # all. When Gate A blocked v0.2.124, its crates were already on crates.io and
  # its GitHub release could only ever stay a draft: the version number was
  # spent, and 0.2.125 had to be cut in its place. Under the new order a Gate A
  # block costs a TAG, which is deletable, and a re-run instead of a release.
  #
  # What stays here is the DRY RUN, which is not irreversible and which fails
  # early -- before the tag is pushed and before ~an hour of cross-compilation
  # and macOS notarization. It catches the packaging class of break (a
  # `include_str!` path outside the crate, #4240) at the cheapest point.
  #
  # freenet only. `cargo publish --dry-run -p fdev` resolves `freenet` from the
  # REGISTRY (crates/fdev/Cargo.toml carries `version = "0.2.x"` next to the
  # path dep), so it cannot succeed until this release's freenet is actually
  # published -- which now happens in cross-compile.yml. Attempting it here
  # would fail every release for a reason that is not a bug.
  verify_publishable:
    name: Verify crates are publishable (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, wait_for_ci]
    # Live only. This used to also run on `|| inputs.dry_run`, which is how a
    # dry run came to depend on a bump PR having really merged (#5936).
    if: always() && needs.wait_for_ci.result == 'success' && needs.validate.outputs.live == 'true'
    env:
      # NEVER `ref: main` here — see #5233. The `|| github.sha` fallback is not
      # a convenience: an empty `ref:` makes actions/checkout default to the
      # branch, which would reinstate the bug. This job now runs only after
      # `wait_for_ci` succeeded, and `wait_for_release_ci.sh` writes the SHA
      # only on success, so the fallback should be unreachable.
      # If it ever engages it is NOT benign: the launch commit predates the
      # version bump, so the verifier below aborts on purpose rather than
      # dry-running the wrong tree.
      RELEASE_SHA: ${{ needs.wait_for_ci.outputs.release_sha || github.sha }}
      # Resolved independently of RELEASE_SHA, so the verifier has an oracle
      # that does not just restate the value that drove the checkout.
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      # Empty exactly when the `|| github.sha` fallback above engaged, so the
      # verifier can name that cause instead of reporting a version mismatch.
      RELEASE_SHA_RESOLVED: ${{ needs.wait_for_ci.outputs.release_sha }}

    steps:
      # The checkout verifier comes from the dispatch ref, which carries the
      # current release tooling. The release commit's tree is the ship commit,
      # which may predate it.
      - name: Check out the release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Keep the release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/verify_release_checkout.sh "$RUNNER_TEMP/release-tools/"

      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.wait_for_ci.outputs.release_sha || github.sha }}

      - name: Verify the checkout is the validated release commit
        run: bash "$RUNNER_TEMP/release-tools/verify_release_checkout.sh"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # No CARGO_REGISTRY_TOKEN here on purpose: a dry run does not upload, and
      # this job must not be able to publish even by accident. The real publish
      # lives in cross-compile.yml's `attach-to-release`, downstream of Gate A,
      # and that is the only place the token belongs.
      - name: Verify freenet packages cleanly (dry run)
        run: |
          echo "📦 [DRY RUN] Verifying freenet ${{ needs.validate.outputs.version }} can be published to crates.io..."
          cargo publish -p freenet --dry-run
          echo "✅ freenet dry-run successful (the real publish runs after Gate A, in cross-compile.yml)"

  create_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `wait_for_ci` is in `needs` only to carry `release_sha` through; the
    # ordering it implies is already enforced via `verify_publishable`.
    needs: [validate, wait_for_ci, verify_publishable]
    # Live only, at job level AND on each mutating step below (#5936).
    if: always() && needs.verify_publishable.result == 'success' && needs.validate.outputs.live == 'true'
    permissions:
      contents: write
      # The stale-release check reads this run's start time
      # (actions/runs/<id>) with github.token, which needs this.
      actions: read
    env:
      RELEASE_LIVE: ${{ needs.validate.outputs.live }}
      # The tag MUST land on the same commit that was published to crates.io.
      # `ref: main` here meant the tag could point at a tree nobody validated
      # and that no published artifact was built from (#5233).
      RELEASE_SHA: ${{ needs.wait_for_ci.outputs.release_sha || github.sha }}
      # Resolved independently of RELEASE_SHA, so the verifier has an oracle
      # that does not just restate the value that drove the checkout.
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      # Empty exactly when the `|| github.sha` fallback above engaged, so the
      # verifier can name that cause instead of reporting a version mismatch.
      RELEASE_SHA_RESOLVED: ${{ needs.wait_for_ci.outputs.release_sha }}

    steps:
      # The checkout verifier comes from the dispatch ref, which carries the
      # current release tooling. The release commit's tree is the ship commit,
      # which may predate it.
      - name: Check out the release tooling
        # No `persist-credentials: false` here: Rule Lint requires a pushing
        # job's checkouts to persist, and the release-commit checkout below
        # replaces this credential with RELEASE_PAT anyway.
        uses: actions/checkout@v7

      - name: Keep the release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/verify_release_checkout.sh "$RUNNER_TEMP/release-tools/"

      - name: Checkout the validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.wait_for_ci.outputs.release_sha || github.sha }}
          fetch-depth: 0
          # `token:` is what `git push` uses later in this job to push the
          # `v$VERSION` tag. The tag push MUST use RELEASE_PAT (when set)
          # so it fires the `tag` event that triggers `cross-compile.yml`.
          # Tags pushed with `GITHUB_TOKEN` are suppressed by GitHub's
          # anti-recursion safeguard (same root cause as #4118).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify the checkout is the validated release commit
        run: bash "$RUNNER_TEMP/release-tools/verify_release_checkout.sh"

      - name: Generate release notes
        id: release_notes
        env:
          # Read-only `gh release list` + `gh api`; coalescing for consistency
          # so future event-emitting additions to this step don't silently
          # regress to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"

          # The previous PUBLISHED release. Drafts are excluded: a spent version
          # is left as a draft on purpose (RELEASE_RECOVERY.md), and measuring
          # from it would drop its commits from these notes. A `gh` failure
          # fails the step rather than shipping bare "Release X" notes; nothing
          # irreversible has happened yet, so a re-run is safe.
          PREV_VERSION=$(gh release list --limit 50 --exclude-drafts --json tagName --jq '.[0].tagName // empty')

          if [ -z "$PREV_VERSION" ]; then
            NOTES="Release $VERSION"
          else
            # Generate notes using GitHub's API
            # The tag does not exist yet at this point, so `target_commitish`
            # decides which commits the notes describe. Pin it to the commit
            # actually being released, not to `main` — otherwise the notes can
            # describe commits that are not in the release (#5233).
            # This job runs live only. The marker is for the linter, which
            # treats any POST-shaped `gh api` as mutating:
            # dry-run-safe: generate-notes is a POST that renders text and creates nothing.
            NOTES=$(gh api repos/:owner/:repo/releases/generate-notes \
              -f tag_name="v$VERSION" \
              -f target_commitish="$RELEASE_SHA" \
              -f previous_tag_name="$PREV_VERSION" \
              --jq '.body')
          fi

          # Save to file for multi-line output
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: needs.validate.outputs.live == 'true'
        env:
          # Sees drafts (validate's read-only token does not), for the
          # stale-release check below. Reads only; the push uses git's own
          # credentials.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # The run-start lookup uses the job token, which this job grants
          # actions: read, so it does not depend on the PAT's scopes.
          RUN_LOOKUP_TOKEN: ${{ github.token }}
        run: |
          [ "${RELEASE_LIVE:-}" = "true" ] || { echo "::error title=Refusing in a dry run::Not pushing the release tag: this run is not live (#5936)."; exit 1; }
          VERSION="${{ needs.validate.outputs.version }}"
          # A release vX.Y.Z created BEFORE this run started is a draft left by
          # an earlier cut of the same version. Refuse before the tag push:
          # the push starts cross-compile.yml, which uploads to whatever
          # release has this tag name, then publishes to crates.io and
          # un-drafts it, with the earlier cut's notes. A release created
          # after the run started is this run's own: "Re-run failed jobs"
          # keeps the run's created_at, so it passes ("Re-run all jobs" re-runs
          # validate, whose pre-flight refuses the existing tag). The
          # pre-flight cannot do this: validate's read-only token is not
          # shown drafts. Fails closed: only gh's "release not found" counts
          # as no release; any other error refuses.
          # `gh release view` resolves a draft by its pending tag (GraphQL) in
          # parallel with the REST by-tag lookup, and prints exactly "release
          # not found" only when neither finds one (gh 2.86 fetch.go). A draft
          # is visible only to a token with push access, which GH_TOKEN has
          # (the next step creates the release with it). createdAt is the
          # creation time, not the commit date (v0.2.164: created 03:08:40Z,
          # tag commit 02:46:24Z). If gh ever rewords the not-found error,
          # this refuses every cut: safe, and visible in the annotation.
          VIEW_ERR=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          if REL_CREATED=$(gh release view "v$VERSION" --json createdAt --jq .createdAt 2>"$VIEW_ERR"); then
            if [ -z "$REL_CREATED" ]; then
              echo "::error::gh release view v$VERSION succeeded but returned no createdAt. Nothing was pushed; re-run this job."
              exit 1
            fi
            if ! RUN_CREATED=$(GH_TOKEN="$RUN_LOOKUP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || [ -z "$RUN_CREATED" ]; then
              echo "::error::Release v$VERSION already exists, and this run's start time could not be read to tell whether this run created it. Nothing was pushed; re-run this job."
              exit 1
            fi
            if [[ "$REL_CREATED" < "$RUN_CREATED" ]]; then
              echo "::error title=Stale release v$VERSION::A release v$VERSION created at $REL_CREATED, before this run started ($RUN_CREATED), already exists: a draft left by an earlier cut. Nothing was pushed. Delete it (gh release delete v$VERSION --yes, after checking crates.io as scripts/RELEASE_RECOVERY.md says), then re-run this job."
              exit 1
            fi
          elif ! grep -qi 'release not found' "$VIEW_ERR"; then
            echo "::error::Could not ask GitHub whether release v$VERSION already exists ($(head -c 200 "$VIEW_ERR" | tr '\n' ' ')). Nothing was pushed; re-run this job."
            exit 1
          fi
          # `git tag -a` needs user.name/email. The `update_versions` job
          # set these in its runner, but this job runs on a fresh runner
          # where git config is empty — without these two lines the tag
          # step fails with `fatal: empty ident name not allowed`.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent, so "Re-run failed jobs" works after the tag pushed but
          # the release create below failed. An existing tag is accepted ONLY
          # if it already points at RELEASE_SHA; anywhere else is a conflict a
          # human must resolve (scripts/RELEASE_RECOVERY.md).
          if ! REFS=$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}"); then
            echo "::error::Could not query origin for tag v$VERSION."
            exit 1
          fi
          # The peeled (^{}) line is the commit of an annotated tag; a
          # lightweight tag has only the plain line.
          PEELED=$(awk -F'\t' -v r="refs/tags/v$VERSION^{}" '$2 == r {print $1}' <<<"$REFS")
          PLAIN=$(awk -F'\t' -v r="refs/tags/v$VERSION" '$2 == r {print $1}' <<<"$REFS")
          REMOTE_SHA="${PEELED:-$PLAIN}"
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Tag v$VERSION already exists at $REMOTE_SHA, not at the release commit $RELEASE_SHA. See scripts/RELEASE_RECOVERY.md."
              exit 1
            fi
            echo "✅ Tag v$VERSION already points at $RELEASE_SHA (re-run); not re-pushing"
            exit 0
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "✅ Created and pushed tag v$VERSION"

      - name: Create GitHub release
        if: needs.validate.outputs.live == 'true'
        env:
          # The release is created with `--draft`, so no `release.published`
          # event fires here. Coalescing for defense-in-depth: if `--draft`
          # is ever dropped, this site must already be on RELEASE_PAT or the
          # cascade silently breaks.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          RUN_LOOKUP_TOKEN: ${{ github.token }}
        run: |
          [ "${RELEASE_LIVE:-}" = "true" ] || { echo "::error title=Refusing in a dry run::Not creating the GitHub release: this run is not live (#5936)."; exit 1; }
          VERSION="${{ needs.validate.outputs.version }}"
          # Idempotent for a re-run of this job after the tag pushed but the
          # create failed: a release THIS RUN created (after the run started;
          # a re-run attempt keeps the run's start time) is accepted. An older
          # one is a stale draft from an earlier cut. The tag step already
          # refused that before pushing; the check is repeated so this step
          # never reuses a stale draft on its own (e.g. if the steps are
          # reordered).
          VIEW_ERR=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          if REL_CREATED=$(gh release view "v$VERSION" --json createdAt --jq .createdAt 2>"$VIEW_ERR"); then
            if [ -z "$REL_CREATED" ]; then
              echo "::error::gh release view v$VERSION succeeded but returned no createdAt. Re-run this job."
              exit 1
            fi
            if ! RUN_CREATED=$(GH_TOKEN="$RUN_LOOKUP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || [ -z "$RUN_CREATED" ]; then
              echo "::error::Release v$VERSION already exists, and this run's start time could not be read to tell whether this run created it. Re-run this job."
              exit 1
            fi
            if [[ "$REL_CREATED" < "$RUN_CREATED" ]]; then
              echo "::error title=Stale release v$VERSION::A release v$VERSION created at $REL_CREATED, before this run started ($RUN_CREATED), already exists: a draft left by an earlier cut. Delete it (gh release delete v$VERSION --yes, after checking crates.io as scripts/RELEASE_RECOVERY.md says), then re-run this job."
              exit 1
            fi
            echo "✅ Release v$VERSION was created by this run ($REL_CREATED); not re-creating"
            exit 0
          elif ! grep -qi 'release not found' "$VIEW_ERR"; then
            # Creating anyway could make a second draft with the same tag.
            echo "::error::Could not ask GitHub whether release v$VERSION already exists ($(head -c 200 "$VIEW_ERR" | tr '\n' ' ')). Re-run this job."
            exit 1
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
            --draft
          echo "✅ Created draft GitHub release v$VERSION"
          echo "   cross-compile.yml now: attaches binaries -> runs Gate A -> publishes to"
          echo "   crates.io -> un-drafts. Nothing irreversible has happened yet; if Gate A"
          echo "   blocks, delete this tag and re-cut rather than burning the version."

  summary:
    name: Release summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, update_versions, wait_for_ci, verify_publishable, dry_run_rehearsal, create_release]
    if: always()
    permissions: {}  # it only prints

    steps:
      # Reports what actually happened. It used to print "is cut and tagged"
      # unconditionally, including for dry runs and failed runs.
      - name: Release summary
        env:
          VALIDATE: ${{ needs.validate.result }}
          LIVE: ${{ needs.validate.outputs.live }}
          VERSION: ${{ needs.validate.outputs.version }}
          FDEV_VERSION: ${{ needs.validate.outputs.fdev_version }}
          BUMP: ${{ needs.update_versions.result }}
          WAIT: ${{ needs.wait_for_ci.result }}
          VERIFY: ${{ needs.verify_publishable.result }}
          REHEARSAL: ${{ needs.dry_run_rehearsal.result }}
          CREATE_RELEASE: ${{ needs.create_release.result }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$VALIDATE" != "success" ]; then
            echo "❌ validate did not succeed ($VALIDATE), so nothing ran: no version was resolved and nothing was pushed."
            exit 0
          fi
          if [ "$LIVE" != "true" ]; then
            echo "🏃 DRY RUN for ${VERSION:-<unresolved version>}: nothing was pushed, tagged or released."
            echo "   Version bump (local only): ${BUMP:-not run}; rehearsal on the unpushed bump commit: ${REHEARSAL:-not run}"
            echo "   What a live run would have created is in the update_versions and dry_run_rehearsal step summaries."
            exit 0
          fi
          if [ "$CREATE_RELEASE" != "success" ]; then
            echo "❌ Release $VERSION did NOT complete. Job results:"
            echo "   update_versions=$BUMP wait_for_ci=$WAIT verify_publishable=$VERIFY create_release=$CREATE_RELEASE"
            echo "   Nothing reaches main from this workflow, so a failed run leaves at most the release/v$VERSION branch"
            echo "   (and, if create_release got that far, the tag and a draft). See scripts/RELEASE_RECOVERY.md before re-running."
            exit 0
          fi
          echo "🎉 Release $VERSION is cut and tagged."
          echo
          echo "Done here:"
          echo "  - release commit on release/v$VERSION passed CI, tag v$VERSION pushed on it"
          echo "  - DRAFT GitHub release created: https://github.com/$REPO/releases/tag/v$VERSION"
          echo
          echo "Still to happen, in cross-compile.yml (triggered by the tag):"
          echo "  - cross-compile + attach binaries"
          echo "  - Gate A: auto-update pre-flight on the binary about to ship (BLOCKING)"
          echo "  - publish freenet $VERSION and fdev $FDEV_VERSION to crates.io"
          echo "  - un-draft the release, which fires the downstream cascade"
          echo
          echo "The crates.io publish is deliberately downstream of Gate A: until it runs,"
          echo "nothing about this release is irreversible."
          echo
          echo "On publish, release-sync.yml opens a PR syncing main's version to $VERSION."
