name: Simulation Tests (Nightly)

# Long-running and large-scale simulation tests too slow for PR CI.
# Medium-scale fdev tests (50 nodes, fault tolerance, high latency, churn
# resilience) now run in the main CI workflow. This workflow covers:
#   - Nightly-gated nextest tests (1h virtual time, 250-contract scale)
#   - Large scale (500 nodes, 10000 events)

on:
  schedule:
    # Run at 3 AM UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Allow manual triggering from any branch
    inputs:
      ref:
        description: "Git ref to checkout (branch, tag, or SHA). Leave empty to use the branch selected in the UI."
        required: false
        default: ""
      seed:
        description: "Simulation seed for reproducibility (hex, e.g., 0xDEADBEEF)"
        required: false
        default: ""

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  large-scale-simulation:
    name: Large Scale Simulation
    runs-on: ubicloud-standard-16
    # This job runs the nextest suite (~109 min) then the 500-node step
    # (≤60 min, its own cap below) sequentially, plus ~4 min build/setup.
    # 150 became too tight once the nextest suite grew (~77→~109 min over
    # mid-2026): the job hit 150 min mid-way through the 500-node step and
    # CANCELLED it. A cancelled job is not a `failure`, so the alert jobs
    # (which gate on `result == 'failure'`) never fired — the 500-node
    # reliability gate was silently skipped for weeks. 195 fits both steps
    # with ~20 min headroom. If the nextest suite keeps growing, prefer
    # splitting the 500-node step into its own parallel job (with its own
    # timeout wired into the notify jobs' `needs`/`if`) over raising this
    # further.
    timeout-minutes: 195

    env:
      RUST_LOG: info,turmoil=warn
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_MIN_STACK: 16777216
      # Use mold linker to avoid rust-lld crashes
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # Simulation seed - use input if provided, otherwise use fixed seed for reproducibility
      SIMULATION_SEED: ${{ github.event.inputs.seed || '0xDEADBEEF' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Show checked out ref
        run: |
          echo "Checked out ref: $(git rev-parse --abbrev-ref HEAD || git rev-parse HEAD)"
          echo "Commit: $(git rev-parse HEAD)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: simulation-large
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      # nextest via the maintained action, not a hand-rolled download.
      # Rationale at the first of these in ci.yml (test_unit job); see #5296.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        id: install-nextest
        timeout-minutes: 5
        with:
          tool: cargo-nextest
          fallback: none

      - name: Clean test directories
        run: |
          rm -rf /tmp/freenet /tmp/freenet-* 2>/dev/null || true

      # Build fdev for simulation tests
      - name: Build fdev
        run: cargo build -p fdev --release

      # Medium scale with alternate seed (explores different code paths).
      # The primary seed (0xDEADBEEF) runs in PR CI; this covers a second path.
      - name: Medium scale test (50 nodes, seed 0xCAFEBABE)
        run: |
          target/release/fdev test \
            --name "nightly-medium-50-alt" \
            --seed 0xCAFEBABE \
            --gateways 4 --nodes 46 --events 2000 \
            --ring-max-htl 12 --max-connections 20 --min-connections 6 \
            --latency-min 10 --latency-max 50 \
            --min-success-rate 1.0 \
            --print-summary --print-network-stats \
            single-process

      # Nightly-gated simulation tests (long-running, high-scale regression tests)
      # Uses Turmoil deterministic scheduler for reproducible results
      # Includes:
      #   - test_long_running_deterministic: 1 hour virtual time
      #   - test_subscription_renewal_at_scale: 250 contracts regression test
      # NOTE: Gated by nightly_tests feature — does NOT run in regular CI
      - name: Nightly simulation tests (long-running + high-scale)
        run: |
          echo "Running all nightly simulation tests (gated by nightly_tests feature)"
          cargo nextest run -p freenet \
            --features "simulation_tests,testing,nightly_tests" \
            --test simulation_integration \
            --test-threads 1 \
            --no-capture \
            --profile nightly

      # Large scale test (500 nodes) - uses direct runner (no turmoil overhead).
      # Takes ~33-46 min on the CI runner (the "~4 min locally" figure this
      # comment used to cite was badly stale). The 60-min step cap below is the
      # binding limit on this step; if it trips, the sim genuinely slowed —
      # investigate rather than reflexively bumping the cap.
      - name: Large scale test (500 nodes)
        timeout-minutes: 60
        env:
          RUST_LOG: warn
        run: |
          echo "Running large scale simulation (500 nodes, 10000 events)"
          target/release/fdev test \
            --name "nightly-large-500" \
            --seed 0x500BEEF \
            --gateways 10 \
            --nodes 490 \
            --events 10000 \
            --ring-max-htl 15 \
            --max-connections 30 \
            --min-connections 10 \
            --latency-min 10 \
            --latency-max 50 \
            --min-success-rate 1.0 \
            --print-summary \
            --print-network-stats \
            single-process

      # Real-process soak test - disabled until the test runs properly
      # TODO: Re-enable once large_network test is stable
      # - name: Run large network soak test (50+ real nodes)
      #   run: |
      #     echo "Running large network soak test with seed: $SIMULATION_SEED"
      #     if command -v riverctl &> /dev/null; then
      #       cargo nextest run -p freenet --test large_network \
      #         -E 'test(large_network_soak)' \
      #         --test-threads 1 \
      #         --no-capture \
      #         --profile nightly
      #     else
      #       echo "Skipping large_network test - riverctl not installed"
      #     fi


  # WAN transport bench R1/R1b (crates/core/src/transport/link_model/r1_tests.rs),
  # in its own job so a failure here cannot skip the 500-node step above and
  # its build does not eat into that job's 195-minute cap. PR CI runs five
  # fixed GATE_SEEDS through the ordinary unit suite; this explores 20 more,
  # rotating with the run number.
  #
  # What a failure here means: each seed must pass the binary checks
  # (completes within 3x ideal, no stream abort or abandoned packet, recovers,
  # flightsize 0 when idle, RTT floor, the spike really happened). Those are
  # collapse signals, so a single failing seed is a real regression or bug.
  # The performance checks (median <= 2x ideal, p90 <= 2.2x) are over the 20
  # seeds together, because small timing changes reshuffle individual seeds.
  # Runs are deterministic per seed, so a failure reproduces locally:
  #   FREENET_WAN_BENCH_SEEDS=<seed> cargo test -p freenet --lib r1_spike_recovery_fixed_rate
  # Once the cause is fixed, add a seed that caught a real bug to GATE_SEEDS.
  wan-bench-r1:
    name: WAN Bench R1
    runs-on: ubicloud-standard-16
    # Steps carry their own timeouts, and this cap is above their sum (5 + 40
    # + 30 + 40 = 115 min, plus setup), so a hang always trips a step first: a
    # step that times out concludes `failure`, which notifies, while a job
    # timeout concludes `cancelled`, which the notify jobs skip.
    timeout-minutes: 140

    env:
      RUST_LOG: error
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # A manual dispatch can name a ref older than the bench.
      - name: Check the ref has the WAN bench
        id: present
        run: |
          if [ -f crates/core/src/transport/link_model/r1_tests.rs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This ref predates the WAN bench; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.present.outputs.run == 'true'
        with:
          toolchain: 1.93.0

      - uses: Swatinem/rust-cache@v2
        if: steps.present.outputs.run == 'true'
        with:
          prefix-key: wan-bench-r1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mold linker
        if: steps.present.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      # Rationale for the action at the first of these in ci.yml; see #5296.
      - name: Install nextest
        if: steps.present.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        timeout-minutes: 5
        with:
          tool: cargo-nextest
          fallback: none

      - name: Build lib tests
        if: steps.present.outputs.run == 'true'
        timeout-minutes: 40
        run: cargo nextest run -p freenet --lib --no-run

      - name: Pick seeds
        if: steps.present.outputs.run == 'true'
        id: seeds
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "list=$(seq -s, $((RUN_NUMBER * 20)) $((RUN_NUMBER * 20 + 19)))" >> "$GITHUB_OUTPUT"

      # Measured locally: about 4 minutes for all six R1/R1b tests on 20 seeds
      # with 7 test threads, on a loaded 16-core host.
      - name: R1 and R1b, gating controller (FixedRate)
        if: steps.present.outputs.run == 'true'
        timeout-minutes: 30
        env:
          FREENET_WAN_BENCH_SEEDS: ${{ steps.seeds.outputs.list }}
        run: |
          echo "FREENET_WAN_BENCH_SEEDS=$FREENET_WAN_BENCH_SEEDS"
          cargo nextest run -p freenet --lib --profile nightly --no-capture \
            -E 'test(/link_model::r1_tests::r1(b)?_(spike_recovery_fixed_rate|runs_are_reproducible_from_the_seed)$/)'

      # BBR and LEDBAT++ are #[ignore]d as known failures (#5929, #5930). Run
      # them anyway so they keep running to their verdict. This step fails if
      # one now PASSES on every seed (remove its #[ignore] and close the
      # issue), or fails in a way its expected failure does not cover: every
      # per-seed reason must match the test's allowed list below, so a new
      # failure mode cannot hide behind a known one.
      - name: R1 and R1b, known failures (BBR, LEDBAT++) still fail the known way
        if: ${{ !cancelled() && steps.present.outputs.run == 'true' }}
        timeout-minutes: 40
        env:
          FREENET_WAN_BENCH_SEEDS: ${{ steps.seeds.outputs.list }}
        run: |
          # Allowed per-seed reasons. A stream that aborts before the spiked
          # ACKs return also leaves no evidence the spike drove its timers.
          slow='^(did not complete within |goodput never reached )'
          abort='^(did not complete within |goodput never reached |sender gave up on the stream )'
          abort_early='^(did not complete within |goodput never reached |sender gave up on the stream |no evidence the spike drove)'
          status=0
          check() {
            test_name=$1 allowed=$2
            set +e
            cargo nextest run -p freenet --lib --profile nightly --no-capture --run-ignored only \
              -E "test(/link_model::r1_tests::${test_name}\$/)" > "${test_name}.log" 2>&1
            rc=$?
            set -e
            tail -n 60 "${test_name}.log"
            if [ "$rc" -eq 0 ]; then
              echo "::error::${test_name} passed on every seed: remove its #[ignore] and close its issue"
              status=1
              return
            fi
            if ! grep -qE '^R1b? failed for' "${test_name}.log"; then
              echo "::error::${test_name} failed without reaching its verdict (panic, hang or build error)"
              status=1
              return
            fi
            unexpected=$(sed -nE 's/^  seed 0x[0-9a-f]+: //p' "${test_name}.log" | grep -vE "$allowed" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::${test_name} failed in a way its known failure does not cover:"
              echo "$unexpected" | sort | uniq -c
              status=1
            fi
          }
          check r1_spike_recovery_bbr "$abort_early"
          check r1_spike_recovery_ledbat "$abort_early"
          # At the shorter stall BBR has never aborted; an abort would be new.
          check r1b_spike_recovery_bbr "$slow"
          check r1b_spike_recovery_ledbat "$abort_early"
          exit "$status"

  # Notify the Freenet dev room on failure.
  #
  # This used to post to Matrix via a direct curl against the matrix.org REST
  # API using a MATRIX_ACCESS_TOKEN secret. That token expired at some point
  # and every nightly failure since 2026-04-07 was also failing to deliver
  # the notification (HTTP 401 M_UNKNOWN_TOKEN). Rather than rotate another
  # standalone token, consolidate on the same transport
  # `river_pr_merge_notify.yml` already uses: `riverctl` against the Freenet
  # gateway, authenticated with the shared `RIVER_SIGNING_KEY` secret. One
  # set of credentials to maintain, and the message ends up in the same
  # Freenet room subscribers are already watching.
  notify-failure:
    name: Notify River on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [large-scale-simulation, wan-bench-r1]
    if: failure() && (needs.large-scale-simulation.result == 'failure' || needs.wan-bench-r1.result == 'failure')
    continue-on-error: true
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install riverctl
        run: cargo install riverctl

      - name: Send failure message to River (with exponential backoff)
        env:
          RIVER_SIGNING_KEY: ${{ secrets.RIVER_SIGNING_KEY }}
        run: |
          MESSAGE="🚨 Nightly Simulation Tests Failed - ${{ github.repository }} - branch: ${{ github.ref_name }} - commit: ${{ github.sha }} - seed: ${{ github.event.inputs.seed || '0xDEADBEEF' }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NODE_URL="${{ secrets.RIVER_GATEWAY_URL }}"
          ROOM_ID="${{ secrets.RIVER_ROOM_ID }}"

          max_attempts=7
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt/$max_attempts (delay: ${delay}s)..."
            if riverctl --node-url "$NODE_URL" message send "$ROOM_ID" "$MESSAGE" 2>&1; then
              echo "Message sent successfully on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Failed, retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::warning::Failed to send River notification after $max_attempts attempts (gateway may be restarting)"
          exit 0

  # Mirror the nightly-failure notification into the private freenet-dev room
  # (the existing notify-failure job above posts to the public official room).
  notify-dev-room-failure:
    name: Notify dev room on Failure
    runs-on: ubuntu-latest
    needs: [large-scale-simulation, wan-bench-r1]
    if: failure() && (needs.large-scale-simulation.result == 'failure' || needs.wan-bench-r1.result == 'failure')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/river-dev-notify
        with:
          message: "🚨 Nightly simulation tests failed — ${{ github.repository }} — branch ${{ github.ref_name }} — commit ${{ github.sha }} — seed ${{ github.event.inputs.seed || '0xDEADBEEF' }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bot-config: ${{ secrets.RIVER_DEV_BOT_CONFIG }}
          room-id: ${{ secrets.RIVER_DEV_ROOM_ID }}
          gateway-url: ${{ secrets.RIVER_GATEWAY_URL }}
