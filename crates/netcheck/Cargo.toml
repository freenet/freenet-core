[package]
name = "netcheck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Synthetic end-to-end check against the live Freenet network: cross-gateway PUT/GET and multi-day retention (#4665)"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
freenet-stdlib = { workspace = true, features = ["net"] }
hex = { workspace = true }
rand = { workspace = true }
# Version-stable RNG for the run-order shuffle: StdRng's algorithm is
# explicitly not reproducible across rand releases.
rand_chacha = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
# Driving the fake node in `client`'s tests: Sink/Stream extensions for the
# server half of the websocket.
futures = { workspace = true }
