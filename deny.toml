# cargo-deny configuration for freenet-core.
# See: https://embarkstudios.github.io/cargo-deny/

[bans]
# Allow multiple versions — most duplicates are semver-incompatible
# versions pulled in by different dependency ecosystems (e.g., wasmtime
# vs reqwest, rustls 0.21 vs 0.23). These cannot be unified without
# upstream changes. Tracked in #4177.
multiple-versions = "allow"

# Ban the aws-lc crypto provider. The crate uses rustls with the ring provider
# only (crates/core/Cargo.toml: rustls, quinn's `rustls-ring`, tokio-rustls's
# `ring`). aws-lc-sys needs cmake and a C toolchain on every release target,
# and two providers in one rustls make `CryptoProvider::get_default` ambiguous.
# A dependency that turns on a default feature pulling it in fails here.
# Enforced only where cargo-deny runs, which is scripts/static-checks.sh; no CI
# job runs cargo-deny, so CI does not enforce this ban.
deny = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
]
